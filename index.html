<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZaNi Web App</title>
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #000000;
      --card-bg: #f4f4f4;
      --border-color: #cccccc;
      --icon-filter: none;
    }

    [data-theme="dark"] {
      --bg-color: #121212;
      --text-color: #ffffff;
      --card-bg: #1e1e1e;
      --border-color: #444444;
      --icon-filter: invert(1);
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      transition: background-color 0.3s, color 0.3s;
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 20px;
      border-bottom: 1px solid var(--border-color);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .avatar {
      width: 50px;
      height: 50px;
      border-radius: 12px;
      object-fit: cover;
    }

    .logo-text {
      font-size: 28px;
      font-weight: bold;
      font-style: italic;
      margin: 0;
    }

    .theme-toggle {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      padding: 5px;
    }

    /* Views Slider */
    .viewport {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .slider {
      display: flex;
      width: 200%;
      height: 100%;
      transition: transform 0.4s ease-in-out;
    }

    .view {
      width: 50%;
      height: 100%;
      box-sizing: border-box;
      padding: 20px;
      overflow-y: auto;
    }

    /* Home View */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 20px;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .upload-box {
      width: 100px;
      height: 100px;
      border: 2px dashed var(--border-color);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background-color: var(--card-bg);
      background-size: cover;
      background-position: center;
      position: relative;
      font-size: 32px;
    }

    .card-name {
      margin-top: 8px;
      font-size: 14px;
      text-align: center;
      border: none;
      background: transparent;
      color: var(--text-color);
      width: 100px;
    }

    .card-name:focus {
      outline: 1px solid var(--border-color);
    }

    /* Profile View */
    .auth-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 80%;
      gap: 15px;
      text-align: center;
    }

    .auth-container input {
      padding: 10px;
      width: 200px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-color);
    }

    .auth-container button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      background: var(--text-color);
      color: var(--bg-color);
      cursor: pointer;
    }

    /* Navigation */
    nav {
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      border-top: 1px solid var(--border-color);
      background: var(--bg-color);
    }

    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: none;
      border: none;
      color: var(--text-color);
      cursor: pointer;
      opacity: 0.5;
      filter: var(--icon-filter);
      transition: opacity 0.3s;
    }

    .nav-btn.active {
      opacity: 1;
    }

    .nav-btn img {
      width: 28px;
      height: 28px;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <img src="01.png" alt="Avatar" class="avatar" id="avatar-img">
      <h1 class="logo-text">ZaNi</h1>
    </div>
    <button class="theme-toggle" id="theme-btn">🔥</button>
  </header>

  <div class="viewport">
    <div class="slider" id="slider">
      
      <!-- Home Layout -->
      <section class="view" id="home-view">
        <div class="grid-container" id="grid">
          <div class="card">
            <label class="upload-box">
              +
              <input type="file" accept="image/*" style="display: none;" onchange="handleUpload(event)">
            </label>
            <input type="text" value="Name" class="card-name">
          </div>
        </div>
      </section>

      <!-- Profile Layout -->
      <section class="view" id="profile-view">
        <div class="auth-container">
          <h2 id="display-username">Not Logged In</h2>
          
          <div id="login-form">
            <p><strong>Has account? Login:</strong></p>
            <input type="text" id="login-user" placeholder="Username"><br><br>
            <button onclick="login()">Login</button>
            <hr style="width: 100%; margin: 20px 0; border-color: var(--border-color);">
            <p><strong>No account? Sign in:</strong></p>
            <input type="text" id="sign-user" placeholder="Create Username"><br>
            <input type="password" id="sign-pw" placeholder="Password"><br><br>
            <button onclick="register()">Sign Up</button>
          </div>
        </div>
      </section>

    </div>
  </div>

  <nav>
    <button class="nav-btn active" id="home-btn" onclick="switchTab('home')">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      <span>Home</span>
    </button>
    <button class="nav-btn" id="profile-btn" onclick="switchTab('profile')">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      <span>Profile</span>
    </button>
  </nav>

  <script>
    const slider = document.getElementById('slider');
    const homeBtn = document.getElementById('home-btn');
    const profileBtn = document.getElementById('profile-btn');
    const themeBtn = document.getElementById('theme-btn');
    let currentUser = "";

    // 1 & 2. Sliding Navigation & Black/White Toggle
    function switchTab(tab) {
      if (tab === 'home') {
        slider.style.transform = 'translateX(0%)';
        homeBtn.classList.add('active');
        profileBtn.classList.remove('active');
      } else {
        slider.style.transform = 'translateX(-50%)';
        profileBtn.classList.add('active');
        homeBtn.classList.remove('active');
      }
    }

    // 3. Picture Upload Functionality
    function handleUpload(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const box = event.target.parentElement;
          box.style.backgroundImage = `url(${e.target.result})`;
          box.innerText = ''; // Clear '+' sign
          
          // Add a new empty slot next to it
          addNewUploadSlot();
        };
        reader.readAsDataURL(file);
      }
    }

    function addNewUploadSlot() {
      const grid = document.getElementById('grid');
      const newCard = document.createElement('div');
      newCard.className = 'card';
      newCard.innerHTML = `
        <label class="upload-box">
          +
          <input type="file" accept="image/*" style="display: none;" onchange="handleUpload(event)">
        </label>
        <input type="text" value="Name" class="card-name">
      `;
      grid.appendChild(newCard);
    }

    // 4. Night Mode / Day Mode Switch
    themeBtn.addEventListener('click', () => {
      const isDark = document.body.getAttribute('data-theme') === 'dark';
      document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      themeBtn.textContent = isDark ? '🔥' : '☀️';
    });

    // Profile Login / Sign Up Logic
    function login() {
      const name = document.getElementById('login-user').value;
      if (name) {
        currentUser = name;
        updateProfileUI();
      }
    }

    function register() {
      const name = document.getElementById('sign-user').value;
      if (name) {
        currentUser = name;
        updateProfileUI();
      }
    }

    function updateProfileUI() {
      document.getElementById('display-username').innerText = `Welcome, ${currentUser}!`;
      document.getElementById('login-form').style.display = 'none';
    }
  </script>
</body>
</html>
