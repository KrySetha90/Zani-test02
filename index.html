<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZaNi Web App</title>
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #000000;
      --card-bg: #f4f4f4;
      --border-color: #cccccc;
    }

    [data-theme="dark"] {
      --bg-color: #121212;
      --text-color: #ffffff;
      --card-bg: #1e1e1e;
      --border-color: #444444;
    }

    body {
      margin: 0; padding: 0;
      font-family: Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex; flex-direction: column;
      height: 100vh; overflow: hidden;
      transition: background-color 0.3s, color 0.3s;
    }

    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 15px 20px; border-bottom: 1px solid var(--border-color);
    }

    .header-left { display: flex; align-items: center; gap: 12px; }
    .avatar { width: 50px; height: 50px; border-radius: 12px; object-fit: cover; }
    .logo-text { font-size: 28px; font-weight: bold; font-style: italic; margin: 0; }
    .theme-toggle { background: none; border: none; font-size: 24px; cursor: pointer; }

    .viewport { flex: 1; position: relative; overflow: hidden; }
    .slider { display: flex; width: 200%; height: 100%; transition: transform 0.4s ease-in-out; }
    .view { width: 50%; height: 100%; box-sizing: border-box; padding: 20px; overflow-y: auto; }

    .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 20px; }
    .card { display: flex; flex-direction: column; align-items: center; }
    .upload-box {
      width: 100px; height: 100px; border: 2px dashed var(--border-color);
      border-radius: 16px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; background-color: var(--card-bg); background-size: cover;
      background-position: center; font-size: 32px;
    }
    .card-name {
      margin-top: 8px; font-size: 14px; text-align: center;
      border: none; background: transparent; color: var(--text-color); width: 100px;
    }

    .auth-container {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; height: 80%; gap: 15px; text-align: center;
    }
    .auth-container input {
      padding: 10px; width: 200px; border-radius: 6px;
      border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-color);
    }
    .auth-container button {
      padding: 10px 20px; border: none; border-radius: 6px;
      background: var(--text-color); color: var(--bg-color); cursor: pointer;
    }

    nav { display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid var(--border-color); }
    .nav-btn { background: none; border: none; color: var(--text-color); opacity: 0.5; cursor: pointer; }
    .nav-btn.active { opacity: 1; }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <img src="01.png" alt="Avatar" class="avatar">
      <h1 class="logo-text">ZaNi</h1>
    </div>
    <button class="theme-toggle" id="theme-btn">🔥</button>
  </header>

  <div class="viewport">
    <div class="slider" id="slider">
      
      <!-- Home Layout -->
      <section class="view" id="home-view">
        <div class="grid-container" id="grid">
          <div class="card" id="upload-slot">
            <label class="upload-box">
              +
              <input type="file" accept="image/*" style="display: none;" onchange="uploadImage(event)">
            </label>
            <input type="text" value="Name" class="card-name">
          </div>
        </div>
      </section>

      <!-- Profile Layout -->
      <section class="view" id="profile-view">
        <div class="auth-container">
          <h2 id="user-display">Not Logged In</h2>
          
          <div id="auth-box">
            <p><strong>Login or Sign Up</strong></p>
            <input type="email" id="email" placeholder="Email"><br><br>
            <input type="password" id="password" placeholder="Password"><br><br>
            <button onclick="handleAuth()">Login / Register</button>
          </div>
        </div>
      </section>

    </div>
  </div>

  <nav>
    <button class="nav-btn active" id="home-btn" onclick="switchTab('home')">Home</button>
    <button class="nav-btn" id="profile-btn" onclick="switchTab('profile')">Profile</button>
  </nav>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>

  <script>
    // YOUR FIREBASE CONFIGURATION GOES HERE
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };
    
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const storage = firebase.storage();

    let currentUser = null;

    // Monitor Auth State (Loads user data automatically when logging in)
    auth.onAuthStateChanged(user => {
      if (user) {
        currentUser = user;
        document.getElementById('user-display').innerText = `Welcome, ${user.email}`;
        document.getElementById('auth-box').style.display = 'none';
        loadUserImages(user.uid);
      }
    });

    // Handle Authentication
    function handleAuth() {
      const email = document.getElementById('email').value;
      const pass = document.getElementById('password').value;

      auth.signInWithEmailAndPassword(email, pass)
        .catch(() => auth.createUserWithEmailAndPassword(email, pass));
    }

    // Upload Picture to Firebase Cloud Storage
    function uploadImage(event) {
      if (!currentUser) return alert("Please log in on the Profile tab first!");
      
      const file = event.target.files[0];
      if (file) {
        const fileRef = storage.ref(`users/${currentUser.uid}/${Date.now()}_${file.name}`);
        fileRef.put(file).then(snapshot => {
          snapshot.ref.getDownloadURL().then(url => {
            // Save Image URL to Database
            db.collection("users").doc(currentUser.uid).collection("photos").add({
              url: url,
              name: "Name",
              createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            renderPhotoCard(url, "Name");
          });
        });
      }
    }

    // Fetch pictures forever from Cloud Database
    function loadUserImages(userId) {
      db.collection("users").doc(userId).collection("photos").get().then(snapshot => {
        snapshot.forEach(doc => {
          const data = doc.data();
          renderPhotoCard(data.url, data.name);
        });
      });
    }

    function renderPhotoCard(url, name) {
      const grid = document.getElementById('grid');
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="upload-box" style="background-image: url('${url}')"></div>
        <input type="text" value="${name}" class="card-name">
      `;
      grid.insertBefore(card, document.getElementById('upload-slot'));
    }

    // Tab Slider
    function switchTab(tab) {
      const slider = document.getElementById('slider');
      if (tab === 'home') {
        slider.style.transform = 'translateX(0%)';
        document.getElementById('home-btn').classList.add('active');
        document.getElementById('profile-btn').classList.remove('active');
      } else {
        slider.style.transform = 'translateX(-50%)';
        document.getElementById('profile-btn').classList.add('active');
        document.getElementById('home-btn').classList.remove('active');
      }
    }

    // Theme Toggle
    document.getElementById('theme-btn').addEventListener('click', () => {
      const isDark = document.body.getAttribute('data-theme') === 'dark';
      document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🔥' : '☀️';
    });
  </script>
</body>
</html>
